<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GTU All In One</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="GTU Student Portal - Results, Question Papers, Syllabus, and Study Materials">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }
    .logo-container svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .offline-msg {
      display: none;
      margin-top: 16px;
    }
    .retry-btn {
      margin-top: 16px;
      padding: 12px 24px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg viewBox="0 0 24 24">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
    </svg>
  </div>
  <h1>GTU All In One</h1>
  <p>Connecting to GTU Student Hub...</p>
  <div class="spinner" id="spinner"></div>
  <div class="offline-msg" id="offlineMsg">
    <p>Unable to connect to GTU server. Please check your internet connection.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
  </div>

  <script>
    const LIVE_URL = "https://gtu-all-in-one.vercel.app";
    setTimeout(() => {
      if (window.location.href.includes("localhost") || window.location.protocol === "file:") {
        window.location.href = LIVE_URL;
      }
    }, 1500);

    window.addEventListener("offline", () => {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("offlineMsg").style.display = "block";
    });
  </script>
</body>
</html>
